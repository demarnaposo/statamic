; Production-style PHP settings, except OPcache revalidates files on every request so
; edits on the Mac (mounted at /srv/app) take effect without rebuilding or restarting.
expose_php = Off
memory_limit = 512M
max_execution_time = 60
upload_max_filesize = 64M
post_max_size = 64M
date.timezone = UTC
display_errors = Off
log_errors = On

opcache.enable = 1
opcache.memory_consumption = 192
opcache.max_accelerated_files = 20000
opcache.validate_timestamps = 1
opcache.revalidate_freq = 0
