[www]
; Only nginx in the same pod talks to FPM (pods share localhost); no hostPort is published for 9000.
listen = 127.0.0.1:9000
; Keep the pod's env vars (APP_ENV, DB_HOST, ...) visible to PHP; they override values in .env.
clear_env = no
pm = dynamic
pm.max_children = 10
pm.start_servers = 2
pm.min_spare_servers = 1
pm.max_spare_servers = 4
pm.max_requests = 500
