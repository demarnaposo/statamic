# Statamic (Laravel) behind nginx: http://cms.test:8000 (local, plain HTTP).
# nginx-unprivileged listens on 8080 inside the pod; PHP-FPM is the `app` container on 127.0.0.1:9000.
# Production adds TLS in front (load balancer/CDN or an HTTPS server block).

server_tokens off;

server {
    listen 8080 default_server;
    listen [::]:8080 default_server;
    server_name cms.test;

    # The project folder on the Mac is mounted at /srv/app (same path in the app container).
    root /srv/app/public;
    index index.php;
    charset utf-8;
    absolute_redirect off;
    client_max_body_size 64m;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/css application/javascript application/json image/svg+xml application/xml text/plain;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Liveness probe for nginx itself (see deploy/podman/cms-pod.yaml).
    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # Published Statamic CP/frontend assets (hashed file names).
    location /vendor/statamic/ {
        add_header X-Content-Type-Options "nosniff" always;
        add_header Cache-Control "public, max-age=604800" always;
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location = /favicon.ico { access_log off; log_not_found off; }
    location = /robots.txt  { access_log off; log_not_found off; }

    location ~ ^/index\.php(/|$) {
        fastcgi_pass 127.0.0.1:9000;
        fastcgi_split_path_info ^(.+\.php)(/.*)$;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        fastcgi_param DOCUMENT_ROOT $realpath_root;
        fastcgi_param HTTP_PROXY "";
        fastcgi_read_timeout 60s;
        fastcgi_buffers 16 16k;
        fastcgi_buffer_size 32k;
        internal;
    }

    # Any other PHP file, dotfiles (.env, .git) → not served.
    location ~ \.php$ { return 404; }
    location ~ /\.(?!well-known).* { deny all; }

    error_page 404 /index.php;
}
