# Local Podman pod for Statamic: http://cms.test (via the edge proxy on port 80, deploy/edge)
# or directly at http://127.0.0.1:8000.
# Kubernetes YAML played by Podman (https://docs.podman.io/en/latest/markdown/podman-kube-play.1.html).
#
#   deploy/podman/cms.sh build          # podman build → localhost/cms-php:latest (only when deploy/php changes)
#   deploy/podman/cms.sh up             # podman kube play --replace (this file, __PROJECT_DIR__ → app folder)
#   deploy/podman/cms.sh down           # podman kube down
#   deploy/podman/cms.sh reload         # reload nginx after editing deploy/nginx/cms.conf
#   deploy/podman/cms.sh queue-restart  # worker picks up code changes
#   deploy/podman/cms.sh artisan …      # php artisan inside the pod
#
# Joins the existing `network-dev` network (mariadb-dev lives there): cms.sh passes --network network-dev.
# The app folder is mounted (not copied): PHP/Blade/Antlers/config edits apply on the next request.
# Env vars below override .env (production-like); everything else (APP_KEY, DB password, …) comes from .env.
apiVersion: v1
kind: Pod
metadata:
  name: cms
  labels:
    app: cms
spec:
  restartPolicy: Always
  containers:
    - name: web
      image: docker.io/nginxinc/nginx-unprivileged:1.29-alpine
      ports:
        - containerPort: 8080
          hostPort: 8000
          hostIP: 127.0.0.1
      livenessProbe:
        httpGet:
          path: /healthz
          port: 8080
        initialDelaySeconds: 2
        periodSeconds: 30
        timeoutSeconds: 5
        failureThreshold: 3
      resources:
        limits:
          cpu: 500m
          memory: 128Mi
      securityContext:
        readOnlyRootFilesystem: true
        allowPrivilegeEscalation: false
        capabilities:
          drop:
            - ALL
      volumeMounts:
        - name: tmp
          mountPath: /tmp
        - name: project
          mountPath: /srv/app
          readOnly: true
        - name: nginx-conf
          mountPath: /etc/nginx/conf.d
          readOnly: true

    - name: app
      image: localhost/cms-php:latest
      env: &app-env
        - name: APP_ENV
          value: production
        - name: APP_DEBUG
          value: "false"
        - name: APP_URL
          value: http://cms.test
        - name: LANDING_URL
          value: http://landing.test
        - name: LOG_LEVEL
          value: info
        - name: DEBUGBAR_ENABLED
          value: "false"
        # mariadb-dev container on the shared network-dev network (resolved by name, internal port)
        - name: DB_HOST
          value: mariadb-dev
        - name: DB_PORT
          value: "3306"
        - name: CORS_ALLOWED_ORIGINS
          value: http://landing.test,http://localhost:4321
        # Astro rebuild receiver on the Mac (from the container, 127.0.0.1 is the pod itself)
        - name: ASTRO_DEPLOY_HOOK_URL
          value: http://host.containers.internal:4322/rebuild?token=local-dev-rebuild
        # "auto" = off in production; keep on so file-based Statamic config edits apply without clearing cache
        - name: STATAMIC_STACHE_WATCHER
          value: "true"
      # Explicit IPv4: Podman's tcpSocket probe checks "localhost", which resolves to ::1 here.
      livenessProbe:
        exec:
          command: ["sh", "-c", "nc -z 127.0.0.1 9000"]
        initialDelaySeconds: 5
        periodSeconds: 30
      resources:
        limits:
          cpu: "2"
          memory: 768Mi
      volumeMounts:
        - name: project
          mountPath: /srv/app

    - name: queue
      image: localhost/cms-php:latest
      command: ["php", "artisan", "queue:work", "--tries=5", "--sleep=3", "--max-time=3600"]
      env: *app-env
      resources:
        limits:
          cpu: 500m
          memory: 256Mi
      volumeMounts:
        - name: project
          mountPath: /srv/app

  volumes:
    # nginx-unprivileged writes its pid and temp files to /tmp.
    - name: tmp
      emptyDir: {}
    # The Laravel app folder on the Mac (storage/ and bootstrap/cache/ must stay writable).
    - name: project
      hostPath:
        path: __PROJECT_DIR__
        type: Directory
    # Edit deploy/nginx/cms.conf, then: deploy/podman/cms.sh reload
    - name: nginx-conf
      hostPath:
        path: __PROJECT_DIR__/deploy/nginx
        type: Directory
