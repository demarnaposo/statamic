# Local edge proxy on host port 80: routes by Host header, like the load balancer/CDN in production.
#   landing.test → landing pod (nginx, static Astro)
#   cms.test     → cms pod (nginx + PHP-FPM: Statamic CP, /api/v1, /portal)
# Upstreams are resolved through the `network-dev` DNS (pod names), re-resolved every 10s so pods can be replaced.

server_tokens off;
resolver 10.89.1.1 valid=10s ipv6=off;

proxy_http_version 1.1;
proxy_set_header Host              $host;
proxy_set_header X-Real-IP         $remote_addr;
proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
proxy_set_header X-Forwarded-Proto $scheme;
proxy_set_header X-Forwarded-Host  $host;
proxy_set_header X-Forwarded-Port  80;
proxy_read_timeout 120s;
client_max_body_size 64m;

server {
    listen 8080 default_server;
    server_name _;

    location = /healthz { access_log off; default_type text/plain; return 200 "ok\n"; }
    location / { default_type text/plain; return 404 "Host tidak dikenal. Gunakan http://landing.test atau http://cms.test\n"; }
}

server {
    listen 8080;
    server_name landing.test;

    location / {
        set $upstream http://landing:8080;
        proxy_pass $upstream;
    }
}

server {
    listen 8080;
    server_name cms.test;

    location / {
        set $upstream http://cms:8080;
        proxy_pass $upstream;
    }
}
