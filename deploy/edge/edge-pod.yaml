# Local edge proxy pod: owns host port 80 and routes by Host (see edge.conf).
#   deploy/edge/edge.sh up | down | reload | logs
# Joins `network-dev` (same as the cms pod, landing pod and mariadb-dev) so it can reach them by pod name.
apiVersion: v1
kind: Pod
metadata:
  name: edge
  labels:
    app: edge
spec:
  restartPolicy: Always
  containers:
    - name: proxy
      image: docker.io/nginxinc/nginx-unprivileged:1.29-alpine
      ports:
        - containerPort: 8080
          hostPort: 80
      livenessProbe:
        httpGet:
          path: /healthz
          port: 8080
        periodSeconds: 30
      resources:
        limits:
          cpu: 250m
          memory: 64Mi
      securityContext:
        allowPrivilegeEscalation: false
      volumeMounts:
        - name: conf
          mountPath: /etc/nginx/conf.d
          readOnly: true
  volumes:
    - name: conf
      hostPath:
        path: __EDGE_DIR__
        type: Directory
