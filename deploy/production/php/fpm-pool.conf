[www]
; FPM runs as www-data (the image's USER), so no user/group switching here.
listen = 9000
; Keep container env vars (APP_KEY, DB_*, CP_ENABLED, ...) visible to PHP.
clear_env = no
; nginx (platform-web) already logs every request.
access.log = /dev/null
catch_workers_output = yes
decorate_workers_output = no

pm = dynamic
pm.max_children = ${FPM_MAX_CHILDREN}
pm.start_servers = 2
pm.min_spare_servers = 1
pm.max_spare_servers = 4
pm.max_requests = 1000
request_terminate_timeout = 120s
