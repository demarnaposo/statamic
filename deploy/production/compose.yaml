# Production stack (Docker Compose). See docs/deployment.md.
#
#   cd deploy/production
#   cp .env.production.example .env.production   # fill in, then once: ln -s .env.production .env
#   docker compose up -d --build                  # or: docker compose --env-file .env.production up -d --build
#
#   internet ─▶ edge (Caddy, 80/443, TLS)
#                ├─ LANDING_DOMAIN ─▶ landing (nginx, volume landing-dist) ◀── landing-builder (bun, deploy hook)
#                ├─ APP_DOMAIN     ─▶ platform-web (nginx) ─▶ app   (PHP-FPM, CP_ENABLED=false): portal + /api/v1
#                └─ ADMIN_DOMAIN   ─▶ platform-web (nginx) ─▶ admin (PHP-FPM, CP_ENABLED=true):  /cp
#   queue (queue:work) · scheduler (schedule:work) · migrate (one-off) · mariadb (profile `db`) · redis
#
# Images: built here from the two repositories (`build:`), or pulled from a registry (`image:` + IMAGE_TAG):
#   docker compose pull && docker compose up -d --no-build
name: ${COMPOSE_PROJECT_NAME:-sertifika}

x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "5"

# Values every PHP role shares. Secrets/settings come from the env file; the computed ones below win.
x-platform-env: &platform-env
  APP_ENV: production
  APP_DEBUG: ${APP_DEBUG:-false}
  APP_URL: ${URL_SCHEME:-https}://${APP_DOMAIN:?APP_DOMAIN is required}${URL_PORT_SUFFIX:-}
  LANDING_URL: ${URL_SCHEME:-https}://${LANDING_DOMAIN:?LANDING_DOMAIN is required}${URL_PORT_SUFFIX:-}
  CORS_ALLOWED_ORIGINS: ${URL_SCHEME:-https}://${LANDING_DOMAIN}${URL_PORT_SUFFIX:-}
  PORTAL_DOMAIN: ${APP_DOMAIN}
  PORTAL_PREFIX: ${PORTAL_PREFIX:-portal}
  CP_ENABLED: "false"
  # Requests only ever arrive from platform-web on the internal network (edge → nginx → FPM).
  TRUSTED_PROXIES: "*"
  SESSION_SECURE_COOKIE: ${SESSION_SECURE_COOKIE:-true}
  LOG_CHANNEL: stderr
  LOG_LEVEL: ${LOG_LEVEL:-info}
  DB_CONNECTION: mariadb
  DB_HOST: ${DB_HOST:-mariadb}
  DB_PORT: ${DB_PORT:-3306}
  REDIS_CLIENT: phpredis
  REDIS_HOST: ${REDIS_HOST:-redis}
  CACHE_STORE: redis
  SESSION_DRIVER: redis
  QUEUE_CONNECTION: redis
  ASTRO_DEPLOY_HOOK_URL: http://landing-builder:4322/rebuild?token=${DEPLOY_HOOK_TOKEN:?DEPLOY_HOOK_TOKEN is required}
  STATAMIC_STACHE_WATCHER: "false"
  STATAMIC_GIT_ENABLED: "false"
  DEBUGBAR_ENABLED: "false"

x-platform: &platform
  image: ${PLATFORM_IMAGE:-sertifika/platform}:${IMAGE_TAG:-latest}
  build:
    context: ${PLATFORM_CONTEXT:-../..}
    dockerfile: deploy/production/Dockerfile
    target: app
  env_file:
    - path: ${ENV_FILE:-.env.production}
      required: true
  environment: *platform-env
  restart: unless-stopped
  read_only: true
  tmpfs:
    - /tmp:mode=1777
    # config/route/event caches, rebuilt by the entrypoint from this container's env
    - /srv/app/bootstrap/cache:mode=1777
  volumes:
    - storage:/srv/app/storage
    - assets:/srv/app/public/assets
  networks: [backend, egress]
  logging: *logging
  depends_on:
    migrate:
      condition: service_completed_successfully
    redis:
      condition: service_healthy

x-fpm-healthcheck: &fpm-healthcheck
  # no spaces inside the PHP snippet: some engines (Podman) re-split CMD arguments
  test: ["CMD", "php", "-r", "exit(@fsockopen('127.0.0.1',9000)?0:1);"]
  interval: 30s
  timeout: 5s
  retries: 3
  start_period: 60s

services:
  edge:
    image: docker.io/library/caddy:2-alpine
    restart: unless-stopped
    read_only: true
    ports:
      - "${EDGE_HTTP_PORT:-80}:80"
      - "${EDGE_HTTPS_PORT:-443}:443"
      - "${EDGE_HTTPS_PORT:-443}:443/udp"
    environment:
      ACME_EMAIL: ${ACME_EMAIL:?ACME_EMAIL is required}
      CADDY_SCHEME: ${CADDY_SCHEME:-}
      LANDING_DOMAIN: ${LANDING_DOMAIN}
      APP_DOMAIN: ${APP_DOMAIN}
      ADMIN_DOMAIN: ${ADMIN_DOMAIN:?ADMIN_DOMAIN is required}
      ADMIN_ALLOWED_IPS: ${ADMIN_ALLOWED_IPS:-0.0.0.0/0 ::/0}
    volumes:
      - ./caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    tmpfs:
      - /tmp
    networks: [public, backend]
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:2019/config/"]
      interval: 30s
      timeout: 5s
      retries: 3
    logging: *logging
    depends_on:
      landing:
        condition: service_started
      platform-web:
        condition: service_started

  landing:
    image: ${LANDING_IMAGE:-sertifika/landing}:${IMAGE_TAG:-latest}
    build:
      context: ${LANDING_CONTEXT:-../../../landing}
      dockerfile: Containerfile
      target: runtime
    restart: unless-stopped
    read_only: true
    volumes:
      # dist/ inside this volume is replaced atomically by landing-builder; the last good build stays served.
      - landing-dist:/srv/app:ro
    tmpfs:
      - /tmp
    networks: [backend]
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3
    logging: *logging

  landing-builder:
    image: ${LANDING_IMAGE:-sertifika/landing}-builder:${IMAGE_TAG:-latest}
    build:
      context: ${LANDING_CONTEXT:-../../../landing}
      dockerfile: Containerfile
      target: builder
    restart: unless-stopped
    environment:
      DEPLOY_HOOK_HOST: 0.0.0.0
      DEPLOY_HOOK_PORT: "4322"
      DEPLOY_HOOK_TOKEN: ${DEPLOY_HOOK_TOKEN}
      DEPLOY_HOOK_OUT_DIR: /srv/landing/dist
      DEPLOY_HOOK_BUILD_ON_START: "true"
      SITE_URL: ${URL_SCHEME:-https}://${LANDING_DOMAIN}${URL_PORT_SUFFIX:-}
      # Build-time content over the internal network (default server of platform-web → app FPM).
      CMS_API_URL: http://platform-web:8080/api/v1
      CMS_API_TIMEOUT_MS: "30000"
      # Baked into the browser bundle: public URLs.
      PUBLIC_API_URL: ${URL_SCHEME:-https}://${APP_DOMAIN}${URL_PORT_SUFFIX:-}/api/v1
      PUBLIC_APP_URL: ${URL_SCHEME:-https}://${APP_DOMAIN}${URL_PORT_SUFFIX:-}/${PORTAL_PREFIX:-portal}
    volumes:
      - landing-dist:/srv/landing
    tmpfs:
      - /tmp
    networks: [backend]
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:4322/status"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    logging: *logging
    depends_on:
      platform-web:
        condition: service_started

  platform-web:
    image: ${PLATFORM_IMAGE:-sertifika/platform}-web:${IMAGE_TAG:-latest}
    build:
      context: ${PLATFORM_CONTEXT:-../..}
      dockerfile: deploy/production/Dockerfile
      target: web
    restart: unless-stopped
    read_only: true
    environment:
      APP_DOMAIN: ${APP_DOMAIN}
      ADMIN_DOMAIN: ${ADMIN_DOMAIN}
    volumes:
      - assets:/srv/app/public/assets:ro
      # public/storage → ../storage/app/public
      - storage:/srv/app/storage:ro
    tmpfs:
      - /tmp
      - /etc/nginx/conf.d:mode=1777
    networks: [backend]
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3
    logging: *logging
    depends_on:
      app:
        condition: service_healthy
      admin:
        condition: service_healthy

  # Portal + API (public). Statamic CP routes are not registered here.
  app:
    <<: *platform
    environment:
      <<: *platform-env
      FPM_MAX_CHILDREN: ${APP_FPM_MAX_CHILDREN:-16}
    healthcheck: *fpm-healthcheck

  # Statamic CP, only reachable through ADMIN_DOMAIN.
  admin:
    <<: *platform
    environment:
      <<: *platform-env
      APP_URL: ${URL_SCHEME:-https}://${ADMIN_DOMAIN}${URL_PORT_SUFFIX:-}
      CP_ENABLED: "true"
      FPM_MAX_CHILDREN: ${ADMIN_FPM_MAX_CHILDREN:-6}
    healthcheck: *fpm-healthcheck

  # Jobs: Astro deploy hook, mail; later the Odoo sync.
  queue:
    <<: *platform
    command: ["php", "artisan", "queue:work", "redis", "--sleep=3", "--tries=3", "--timeout=90", "--max-time=3600", "--max-jobs=1000"]
    stop_grace_period: 120s
    healthcheck:
      test: ["CMD", "php", "artisan", "queue:monitor", "redis:default", "--max=1000"]
      interval: 60s
      timeout: 20s
      retries: 3
      start_period: 60s

  scheduler:
    <<: *platform
    command: ["php", "artisan", "schedule:work"]
    healthcheck:
      test: ["CMD", "php", "artisan", "schedule:list"]
      interval: 60s
      timeout: 20s
      retries: 3
      start_period: 60s

  # One-off: runs on every `up` with a new image, then exits. Everything PHP waits for it.
  migrate:
    <<: *platform
    command: ["php", "artisan", "migrate", "--force", "--no-interaction"]
    restart: "no"
    environment:
      <<: *platform-env
      # Route/config caches may touch tables that the migration is about to create.
      APP_OPTIMIZE: "false"
    healthcheck:
      disable: true
    depends_on:
      mariadb:
        condition: service_healthy
        # External DB (DB_HOST=rds…): leave profile `db` out of COMPOSE_PROFILES.
        required: false
      redis:
        condition: service_healthy

  mariadb:
    image: ${MARIADB_IMAGE:-docker.io/library/mariadb:11.8}
    profiles: [db]
    restart: unless-stopped
    environment:
      MARIADB_DATABASE: ${DB_DATABASE:?DB_DATABASE is required}
      MARIADB_USER: ${DB_USERNAME:?DB_USERNAME is required}
      MARIADB_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD is required}
      MARIADB_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:?DB_ROOT_PASSWORD is required}
      MARIADB_AUTO_UPGRADE: "1"
    command: ["--character-set-server=utf8mb4", "--collation-server=utf8mb4_unicode_ci"]
    volumes:
      - db:/var/lib/mysql
    tmpfs:
      - /tmp
      - /run/mysqld
    networks: [backend]
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    logging: *logging

  redis:
    image: docker.io/library/redis:8-alpine
    restart: unless-stopped
    read_only: true
    command: ["sh", "-c", "exec redis-server --requirepass \"$$REDIS_PASSWORD\" --appendonly yes --maxmemory-policy noeviction"]
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?REDIS_PASSWORD is required}
      REDISCLI_AUTH: ${REDIS_PASSWORD}
    volumes:
      - redis:/data
    networks: [backend]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    logging: *logging

networks:
  # edge only: ports 80/443
  public: {}
  # no route to the internet; services find each other by name
  backend:
    internal: true
  # outbound for PHP (SMTP, Statamic license check, later Odoo)
  egress: {}

volumes:
  db:
  redis:
  storage:
  assets:
  landing-dist:
  caddy-data:
  caddy-config:
